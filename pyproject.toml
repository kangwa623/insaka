[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insaka"
version = "0.1.0"
description = "Generative AI for bridging SME cash flow and credit (Absa GenAI-Thon prototype)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
