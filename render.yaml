# Render blueprint for the Insaka API (free tier). Render -> New -> Blueprint -> this repo.
services:
  - type: web
    name: insaka-zm-api
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt && pip install -e . &&
      python -m insaka.generator --n 150 --seed 42 --out data/synthetic --no-pdf &&
      python -m insaka.demo --seed
    startCommand: gunicorn "insaka.api:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: INSAKA_ENV
        value: production
      # Signs tokens and derives each account's authenticator secret; generated by Render,
      # never in the repository.
      - key: INSAKA_SECRET_KEY
        generateValue: true
      # Demo sign-in: choose an account, then the authenticator code (still checked).
      # A pilot sets this to "0" and adds INSAKA_DEMO_PASSWORD to require a password too.
      - key: INSAKA_DEMO_SIGNIN
        value: "1"
      # Prototype only: show the current authenticator code at sign-in. Remove for a pilot.
      - key: INSAKA_DEMO_MFA_HELPER
        value: "1"
      - key: INSAKA_CORS_ORIGINS
        value: https://insaka.web.app,https://insaka.firebaseapp.com
      - key: INSAKA_SITE_URL
        value: https://insaka.web.app
      - key: GROQ_API_KEY
        sync: false
