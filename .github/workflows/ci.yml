name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e . && pip install pip-audit==2.9.0
      - name: Known vulnerabilities in Python dependencies
        run: pip-audit -r requirements.txt
      - name: Tests (including the security tests)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - name: Known vulnerabilities in npm dependencies
        run: npm audit --audit-level=high
      - run: npm run build
